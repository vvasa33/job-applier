[project]
name = "jobhunter"
version = "0.1.0"
description = "Local job hunting assistant"
requires-python = ">=3.12"
dependencies = [
  "alembic>=1.14",
  "fastapi>=0.115",
  "httpx>=0.27",
  "pydantic-settings>=2.6",
  "playwright>=1.49",
  "sqlalchemy>=2.0",
  "uvicorn[standard]>=0.32",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
]

[project.scripts]
jobhunter = "jobhunter.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = ["src/jobhunter"]

[tool.hatch.build.targets.wheel.sources]
"src/jobhunter" = "jobhunter"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q -m 'not live'"
pythonpath = ["."]
markers = [
  "live: queries a public career site; excluded from the default test run",
]
