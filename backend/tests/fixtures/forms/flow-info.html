<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>My Information</title>
</head>
<body>
  <div data-automation-id="applyFlowPage">
    <h2 data-automation-id="pageHeaderTitle">My Information</h2>
    <div data-automation-id="formField-legalName--firstName">
      <label for="first-name">First Name<span aria-hidden="true">*</span></label>
      <input id="first-name" data-automation-id="legalName--firstName" aria-required="true" type="text">
    </div>
    <div data-automation-id="formField-email">
      <label for="email">Email<span aria-hidden="true">*</span></label>
      <input id="email" data-automation-id="email" aria-required="true" type="email">
    </div>
    <button id="next" type="button" data-automation-id="pageFooterNextButton">Save and Continue</button>
  </div>
  <script>
    document.getElementById("next").addEventListener("click", () => {
      window.location.href = "flow-questions.html";
    });
  </script>
</body>
</html>
